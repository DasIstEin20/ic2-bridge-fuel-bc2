[[mods]]
    modId="ic2universalenergy"
    version="${version}"
    displayName="IC2 Universal Energy Extension"
    authors="DasIstEin20, bridge contributors; original Mekanism transmitter code by Aidancbrady, Thommy101, Thiakil, pupnewfster, dizzyd"
    credits="Literal transmitter and Configurator code/assets from Mekanism 10.4.16; unpairedbracket, CyanideX, Ridanisaurus and other Mekanism contributors"
